name: desktop

# Builds, tests and packages the ThixGate desktop app for Windows and macOS on every branch, versioned by branch:
#   main  -> release : <major>.<minor>.<run number>-<date>   e.g. 0.1.42-20261126
#   dev   -> nightly : nightly-<run number>-<date>          e.g. nightly-43-20261126
#   other -> local   : local-<date>                          (feature branches, pull requests: built and tested, never published)
# The run number grows with every build of this workflow and is the build number the update check compares.
#
# The remote engine is Matgate's (Mat.Remote): the submodule external/Matgate is checked out with the code.
#
# Packages:
#   Windows : ThixGateSetup.exe (the program is its own setup: install, update, uninstall)
#   macOS   : ThixGate-macOS-<arm64|x64>.dmg (first installation) and .zip (update of installed versions)
#   every build      : workflow artifact "ThixGate-<version>" (all packages + update manifest)
#   main (push or manual run) : rolling release "release-channel" (OTA feed of release builds) + versioned release "v<version>"
#   dev  (push or manual run) : rolling pre-release "nightly-channel" (OTA feed of nightly builds)
# The update manifest thixgate-update.json (UpdateService, ThixLauncher: catalog entry "thixgate") names ThixGateSetup.exe for
# win-x64 and ThixGate-macOS-<arch>.zip for osx-<arch>, plus the install options ("installer", src/ThixGate.Core/installer.json).
# "publish" needs a green Windows job; when GitHub has no macOS runner the release goes out for Windows and the manifest names only
# the macOS packages that were built.

on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'branding/**'
      - 'scripts/**'
      - 'external/**'
      - 'ThixGate.slnx'
      - 'Directory.Build.props'
      - 'global.json'
      - '.gitmodules'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

# One run per branch at a time: two quick pushes must not upload to the same release channel at once (queued, not cancelled).
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.ver.outputs.channel }}
      date: ${{ steps.ver.outputs.date }}
      build: ${{ steps.ver.outputs.build }}
      version: ${{ steps.ver.outputs.version }}
      props: ${{ steps.ver.outputs.props }}
    steps:
      - uses: actions/checkout@v4

      # One version for every platform of this run (the jobs may run across midnight).
      - name: Determine version metadata
        id: ver
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            main) channel=release ;;
            dev)  channel=nightly ;;
            *)    channel=local ;;
          esac
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then channel=local; fi
          date=$(date -u +%Y%m%d)
          build=${GITHUB_RUN_NUMBER}
          major=$(sed -n 's:.*<ThixGateMajor>\(.*\)</ThixGateMajor>.*:\1:p' Directory.Build.props)
          minor=$(sed -n 's:.*<ThixGateMinor>\(.*\)</ThixGateMinor>.*:\1:p' Directory.Build.props)
          case "$channel" in
            release) version="${major}.${minor}.${build}-${date}" ;;
            nightly) version="nightly-${build}-${date}" ;;
            *)       version="local-${date}" ;;
          esac
          {
            echo "channel=$channel"
            echo "date=$date"
            echo "build=$build"
            echo "version=$version"
            echo "props=-p:Channel=$channel -p:BuildNumber=$build -p:BuildDate=$date"
          } >> "$GITHUB_OUTPUT"
          printf '### ThixGate (Desktop)\n\n- version: `%s`\n- channel: `%s`\n' "$version" "$channel" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ThixGate.slnx

      - name: Build
        run: dotnet build ThixGate.slnx -c Release --no-restore ${{ needs.version.outputs.props }}

      # ThixGate.Tests: business layer, sync, setup; ThixGate.UiTests: the UI rendered headless. The sessions against a real desktop
      # (SessionEndToEndTests) need THIXGATE_E2E_DESKTOP and are skipped here.
      - name: Test
        run: dotnet test ThixGate.slnx -c Release --no-build --logger GitHubActions
        env:
          THIXGATE_SCREENSHOTS: ${{ github.workspace }}/screenshots

      - name: Publish (win-x64, self-contained single file)
        run: dotnet publish src/ThixGate/ThixGate.csproj -c Release -r win-x64 -o publish ${{ needs.version.outputs.props }}

      # The published program is trimmed: it checks itself (SelfTest.cs) – JSON, the library and vault, the remote engine, the token
      # store, shortcuts (COM) and every window – before anybody downloads it.
      - name: Self test of the published program
        shell: pwsh
        timeout-minutes: 5
        run: |
          $process = Start-Process -FilePath publish\ThixGate.exe -ArgumentList '--self-test', "$PWD\self-test.txt" -Wait -PassThru
          if (Test-Path self-test.txt) { Get-Content self-test.txt } else { Write-Host 'no report written' }
          if ($process.ExitCode -ne 0) { throw "self test failed (exit code $($process.ExitCode))" }

      # ThixGate.exe is its own setup (InstallService): started from the download it installs itself per user, "--update" is the
      # silent update, "--uninstall" the uninstaller. No installer tool needed.
      - name: Package setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item publish\ThixGate.exe artifacts\ThixGateSetup.exe
          Get-ChildItem artifacts | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/
          retention-days: 2

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ThixGate.slnx

      - name: Build
        run: dotnet build ThixGate.slnx -c Release --no-restore ${{ needs.version.outputs.props }}

      # The same tests as on Windows, here with the macOS defaults (Keychain, LaunchAgent).
      - name: Test
        run: dotnet test ThixGate.slnx -c Release --no-build --logger GitHubActions
        env:
          THIXGATE_SCREENSHOTS: ${{ github.workspace }}/screenshots

      - name: Publish and package (arm64 and x64)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/package-macos.sh
          for rid in osx-arm64 osx-x64; do
            dotnet publish src/ThixGate/ThixGate.csproj -c Release -r "$rid" -o "publish/$rid" ${{ needs.version.outputs.props }}
            scripts/package-macos.sh "publish/$rid" "$rid" "${{ needs.version.outputs.version }}" "${{ needs.version.outputs.build }}" artifacts
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/
          retention-days: 2

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore

  publish:
    needs: [version, windows, macos]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # installer.json: the install options (SETUP-08) go into the manifest as "installer" (ThixLauncher, ThixInstall)
      - uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: src/ThixGate.Core/installer.json
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts

      - uses: actions/download-artifact@v4
        if: needs.macos.result == 'success'
        with:
          name: macos
          path: artifacts

      # The manifest the installed application reads for its update check (UpdateService) and ThixLauncher for installing:
      # "setup"/"sha256" for Windows, "packages" for each platform that was built, "installer" what the setup offers (SETUP-08).
      - name: Write update manifest
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          packages="\"win-x64\": { \"file\": \"ThixGateSetup.exe\", \"sha256\": \"$(sha ThixGateSetup.exe)\" }"
          for arch in arm64 x64; do
            if [ -f "ThixGate-macOS-${arch}.zip" ]; then
              packages="${packages}, \"osx-${arch}\": { \"file\": \"ThixGate-macOS-${arch}.zip\", \"sha256\": \"$(sha "ThixGate-macOS-${arch}.zip")\" }"
            fi
          done
          cat > thixgate-update.json <<JSON
          {
            "version": "${{ needs.version.outputs.version }}",
            "channel": "${{ needs.version.outputs.channel }}",
            "buildNumber": ${{ needs.version.outputs.build }},
            "setup": "ThixGateSetup.exe",
            "sha256": "$(sha ThixGateSetup.exe)",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "installer": $(cat ../source/src/ThixGate.Core/installer.json),
            "packages": { ${packages} }
          }
          JSON
          python3 -m json.tool thixgate-update.json
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: ThixGate-${{ needs.version.outputs.version }}
          path: artifacts/
          retention-days: 30

      # One rolling release per channel; each build replaces its files. The packages go up BEFORE the manifest,
      # so an installation never reads a manifest whose package is not there yet.
      - name: Publish to the update channel
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.version.outputs.channel != 'local'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          channel="${{ needs.version.outputs.channel }}"
          version="${{ needs.version.outputs.version }}"
          tag="${channel}-channel"
          if [ "$channel" = "release" ]; then prerelease=""; title="ThixGate (Release-Kanal)"; else prerelease="--prerelease"; title="ThixGate (Nightly-Kanal)"; fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" $prerelease \
              --notes "Neuester Build des Kanals ${channel}. Windows: ThixGateSetup.exe installiert oder aktualisiert ThixGate. macOS: ThixGate-macOS-arm64.dmg (Apple Silicon) bzw. -x64.dmg (Intel) öffnen und ThixGate in „Programme“ ziehen. Installierte Versionen aktualisieren sich von hier aus selbst."
          fi
          shopt -s nullglob
          gh release upload "$tag" artifacts/ThixGateSetup.exe artifacts/ThixGate-macOS-*.zip artifacts/ThixGate-macOS-*.dmg --clobber
          gh release upload "$tag" artifacts/thixgate-update.json --clobber
          gh release edit "$tag" --title "$title – $version"
          echo "Published $version to $tag"

      - name: Versioned release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.version.outputs.channel == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          cd artifacts
          files=("ThixGateSetup-${version}.exe")
          cp ThixGateSetup.exe "ThixGateSetup-${version}.exe"
          for arch in arm64 x64; do
            if [ -f "ThixGate-macOS-${arch}.dmg" ]; then
              cp "ThixGate-macOS-${arch}.dmg" "ThixGate-${version}-macOS-${arch}.dmg"
              files+=("ThixGate-${version}-macOS-${arch}.dmg")
            fi
          done
          gh release create "v${version}" --target "$GITHUB_SHA" --title "ThixGate ${version}" --generate-notes "${files[@]}"
