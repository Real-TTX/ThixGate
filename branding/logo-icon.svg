<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    ThixGate app icon, full detail (48 px and larger): a gate - an arch on two pillars - with a chevron going through it:
    connecting through the gateway to the remote machine. On an indigo tile. Geometry on a 256 grid;
    tools/render-icons.js renders the PNG, ICO and ICNS files from it.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#8F86FF"/>
      <stop offset="1" stop-color="#4B3FCF"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#tile)"/>
  <path d="M80 190V122A48 48 0 0 1 176 122V190" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M120 128L148 154L120 180" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
