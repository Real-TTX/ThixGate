<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    The cloud tile of ThixGate (home screen, 48 px and larger): the gate of the app icon with a cloud badge bottom right.
    Maskable: everything important sits inside the safe zone (centre circle of 80 %).
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#8F86FF"/>
      <stop offset="1" stop-color="#4B3FCF"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEAFF"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="url(#tile)"/>
  <path d="M62 164V112A46 46 0 0 1 154 112V164A10 10 0 0 1 144 174H72A10 10 0 0 1 62 164Z" fill="url(#gate)"/>
  <path d="M86 174V118A22 22 0 0 1 130 118V174Z" fill="#2E2496"/>
  <path d="M101 132L115 145L101 158" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M150 204h44a22 22 0 0 0 2-43.9 30 30 0 0 0-57.6 6.6A19 19 0 0 0 150 204z" fill="#2E2690" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
</svg>
